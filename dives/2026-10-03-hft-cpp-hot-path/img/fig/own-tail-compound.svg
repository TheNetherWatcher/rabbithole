<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg">
<defs></defs>
<text x="24" y="30" text-anchor="start" font-family="system-ui,sans-serif" font-size="15" class="t-ink" font-weight="600">Chance that a tick hits at least one slow stage (p = 1% per stage)</text>
<text x="24" y="83" text-anchor="start" font-family="system-ui,sans-serif" font-size="14" class="t-mute">1 stage</text>
<rect x="230" y="64" width="2" height="28" rx="0" class="f-line s-line" stroke-width="0"/>
<rect x="230" y="64" width="3.3000000000000003" height="28" rx="4" class="f-acc2 s-acc2" stroke-width="1.5"/>
<text x="243.3" y="83" text-anchor="start" font-family="system-ui,sans-serif" font-size="15" class="t-ink" font-weight="600">1%</text>
<text x="24" y="139" text-anchor="start" font-family="system-ui,sans-serif" font-size="14" class="t-mute">6 stages</text>
<rect x="230" y="120" width="2" height="28" rx="0" class="f-line s-line" stroke-width="0"/>
<rect x="230" y="120" width="19.47" height="28" rx="4" class="f-acc2 s-acc2" stroke-width="1.5"/>
<text x="259.47" y="139" text-anchor="start" font-family="system-ui,sans-serif" font-size="15" class="t-ink" font-weight="600">5.9%</text>
<text x="24" y="195" text-anchor="start" font-family="system-ui,sans-serif" font-size="14" class="t-mute">100 stages (fan-out)</text>
<rect x="230" y="176" width="2" height="28" rx="0" class="f-line s-line" stroke-width="0"/>
<rect x="230" y="176" width="207.9" height="28" rx="4" class="f-acc s-acc" stroke-width="1.5"/>
<text x="447.9" y="195" text-anchor="start" font-family="system-ui,sans-serif" font-size="15" class="t-ink" font-weight="600">63%</text>
<text x="24" y="226" text-anchor="start" font-family="system-ui,sans-serif" font-size="13" class="t-mute">P = 1 − (1 − p)^N: every stage's slow tail multiplies into the path's tail.</text>
</svg>
