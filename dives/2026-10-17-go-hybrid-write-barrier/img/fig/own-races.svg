<svg viewBox="0 0 860 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two races: a black stack hides an object loaded from the heap, and a grey stack stores its only pointer into a black heap object">
<text x="30" y="34" class="t-ink" style="font-size:15px;font-weight:700">S1 · black stack hides C</text>
<text x="470" y="34" class="t-ink" style="font-size:15px;font-weight:700">S2 · grey stack feeds black A</text>
<circle cx="100" cy="110" r="28" class="f-hl s-warn" stroke-width="2.5" /><circle cx="310" cy="110" r="28" class="f-panel s-mute" stroke-width="2.5" stroke-dasharray="5 4" /><text x="100" y="116" class="t-ink" style="font-size:16px;text-anchor:middle">B</text><text x="310" y="116" class="t-ink" style="font-size:16px;text-anchor:middle">C</text>
<path d="M128.0 110.0 L271.0 110.0" class="f-none s-mute" stroke-width="2" opacity=".5"/><path d="M280.0 110.0 L271.0 114.5 L271.0 105.5 Z" class="f-mute" opacity=".5"/>
<path d="M180 94 l36 32 M216 94 l-36 32" class="f-none s-bad" stroke-width="3.5"/>
<text x="150" y="82" class="t-mute" style="font-size:13px">② B.f = nil</text>
<rect x="170" y="220" width="170" height="64" rx="8" class="f-ink"/>
<text x="255" y="248" class="t-ink" style="fill:var(--bg);font-size:14px;text-anchor:middle">stack S (black)</text><text x="255" y="268" class="t-ink" style="fill:var(--bg);font-size:13px;text-anchor:middle">holds t = C</text>
<path d="M300.0 220.0 L310.4 153.9" class="f-none s-acc" stroke-width="2.5" /><path d="M312.0 144.0 L315.4 154.7 L305.5 153.1 Z" class="f-acc" />
<text x="330" y="190" class="t-mute" style="font-size:13px">① t := B.f</text>
<text x="30" y="318" class="t-mute" style="font-size:13px">Fix: shade(old = C). Without it C stays white while S holds it.</text>
<circle cx="540" cy="110" r="28" class="f-ink s-ink" stroke-width="2.5" /><circle cx="750" cy="110" r="28" class="f-panel s-mute" stroke-width="2.5" stroke-dasharray="5 4" /><text x="540" y="116" class="t-ink" style="fill:var(--bg);font-size:16px;text-anchor:middle">A</text><text x="750" y="116" class="t-ink" style="font-size:16px;text-anchor:middle">C</text>
<path d="M568.0 110.0 L710.0 110.0" class="f-none s-acc" stroke-width="2.5" /><path d="M720.0 110.0 L710.0 115.0 L710.0 105.0 Z" class="f-acc" />
<text x="560" y="82" class="t-mute" style="font-size:13px">① A.f = C</text>
<rect x="620" y="220" width="190" height="64" rx="8" class="f-hl s-warn" stroke-width="2.5"/>
<text x="715" y="248" class="t-ink" style="font-size:14px;text-anchor:middle">stack S (grey)</text><text x="715" y="268" class="t-ink" style="font-size:13px;text-anchor:middle">only holder of C</text>
<path d="M745.0 220.0 L749.3 154.0" class="f-none s-mute" stroke-width="2" opacity=".5"/><path d="M750.0 144.0 L754.3 154.3 L744.4 153.7 Z" class="f-mute" opacity=".5"/>
<path d="M770 176 l30 24 M800 176 l-30 24" class="f-none s-bad" stroke-width="3.5"/>
<text x="810" y="178" class="t-mute" style="font-size:13px">② S drops C</text>
<text x="470" y="318" class="t-mute" style="font-size:13px">Fix: shade(new = C). Without it C hides inside black A.</text>
</svg>