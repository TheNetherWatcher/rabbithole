<svg viewBox="0 0 760 322" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="ah-deopt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-mute"/></marker></defs><rect x="20" y="50" width="150" height="84" rx="8" class="f-panel s-line" stroke-width="1.5"/><text x="95.0" y="81.0" text-anchor="middle" class="t-ink" style="font:600 14px ui-monospace,monospace">optimized code</text><text x="95.0" y="99.0" text-anchor="middle" class="t-mute" style="font:400 12px ui-monospace,monospace">cmp map, M2</text><text x="95.0" y="117.0" text-anchor="middle" class="t-mute" style="font:400 12px ui-monospace,monospace">jne deopt</text><rect x="210" y="50" width="150" height="84" rx="8" class="f-hl s-warn" stroke-width="1.5"/><text x="285.0" y="90.0" text-anchor="middle" class="t-ink" style="font:600 14px ui-monospace,monospace">CheckMaps fails</text><text x="285.0" y="108.0" text-anchor="middle" class="t-mute" style="font:400 12px ui-monospace,monospace">map is M3, not M2</text><rect x="400" y="50" width="150" height="84" rx="8" class="f-panel s-line" stroke-width="1.5"/><text x="475.0" y="81.0" text-anchor="middle" class="t-ink" style="font:600 14px ui-monospace,monospace">eager deopt</text><text x="475.0" y="99.0" text-anchor="middle" class="t-mute" style="font:400 12px ui-monospace,monospace">translation table</text><text x="475.0" y="117.0" text-anchor="middle" class="t-mute" style="font:400 12px ui-monospace,monospace">rebuilds frame</text><rect x="590" y="50" width="150" height="84" rx="8" class="f-panel s-line" stroke-width="1.5"/><text x="665.0" y="81.0" text-anchor="middle" class="t-ink" style="font:600 14px ui-monospace,monospace">resume in</text><text x="665.0" y="99.0" text-anchor="middle" class="t-mute" style="font:400 12px ui-monospace,monospace">Ignition at</text><text x="665.0" y="117.0" text-anchor="middle" class="t-mute" style="font:400 12px ui-monospace,monospace">bytecode offset</text><path d="M170,92 L210,92" fill="none" class="s-warn flow" stroke-width="1.6" marker-end="url(#ah-deopt)" stroke-dasharray="6 6"/><path d="M360,92 L400,92" fill="none" class="s-mute" stroke-width="1.6" marker-end="url(#ah-deopt)"/><path d="M550,92 L590,92" fill="none" class="s-mute" stroke-width="1.6" marker-end="url(#ah-deopt)"/><rect x="590" y="200" width="150" height="84" rx="8" class="f-hl s-acc" stroke-width="1.5"/><text x="665.0" y="240.0" text-anchor="middle" class="t-ink" style="font:600 14px ui-monospace,monospace">IC miss: POLY</text><text x="665.0" y="258.0" text-anchor="middle" class="t-mute" style="font:400 12px ui-monospace,monospace">(M2,h1), (M3,h2)</text><rect x="210" y="200" width="150" height="84" rx="8" class="f-panel s-line" stroke-width="1.5"/><text x="285.0" y="240.0" text-anchor="middle" class="t-ink" style="font:600 14px ui-monospace,monospace">re-optimize</text><text x="285.0" y="258.0" text-anchor="middle" class="t-mute" style="font:400 12px ui-monospace,monospace">2-way CheckMaps</text><path d="M665,134 L665,200" fill="none" class="s-mute" stroke-width="1.6" marker-end="url(#ah-deopt)"/><path d="M590,242 L360,242" fill="none" class="s-mute" stroke-width="1.6" marker-end="url(#ah-deopt)"/><text x="475" y="234" text-anchor="middle" class="t-mute" style="font:400 12px system-ui,sans-serif">next tier: guard on both Maps</text><text x="20" y="310" text-anchor="start" class="t-mute" style="font:400 12px system-ui,sans-serif">Guard fails, so the code exits to the interpreter and the IC learns the new Map.</text></svg>
