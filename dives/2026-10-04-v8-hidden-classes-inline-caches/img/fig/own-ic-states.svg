<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="ah-ic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-mute"/></marker></defs><rect x="30" y="100" width="110" height="56" rx="8" class="f-panel s-line" stroke-width="1.5"/><text x="85.0" y="126.0" text-anchor="middle" class="t-ink" style="font:600 14px ui-monospace,monospace">UNINIT</text><text x="85.0" y="144.0" text-anchor="middle" class="t-mute" style="font:400 12px ui-monospace,monospace">no Map yet</text><rect x="220" y="100" width="110" height="56" rx="8" class="f-hl s-acc" stroke-width="1.5"/><text x="275.0" y="126.0" text-anchor="middle" class="t-ink" style="font:600 14px ui-monospace,monospace">MONO</text><text x="275.0" y="144.0" text-anchor="middle" class="t-mute" style="font:400 12px ui-monospace,monospace">1 Map</text><rect x="410" y="100" width="130" height="56" rx="8" class="f-hl s-acc" stroke-width="1.5"/><text x="475.0" y="126.0" text-anchor="middle" class="t-ink" style="font:600 14px ui-monospace,monospace">POLY</text><text x="475.0" y="144.0" text-anchor="middle" class="t-mute" style="font:400 12px ui-monospace,monospace">2 to 4 Maps</text><rect x="620" y="100" width="110" height="56" rx="8" class="f-panel s-bad" stroke-width="1.5"/><text x="675.0" y="126.0" text-anchor="middle" class="t-ink" style="font:600 14px ui-monospace,monospace">MEGA</text><text x="675.0" y="144.0" text-anchor="middle" class="t-mute" style="font:400 12px ui-monospace,monospace">stub cache</text><path d="M140,128 L220,128" fill="none" class="s-mute" stroke-width="1.6" marker-end="url(#ah-ic)"/><text x="180" y="116" text-anchor="middle" class="t-ink" style="font:400 12px ui-monospace,monospace">first Map</text><path d="M330,128 L410,128" fill="none" class="s-mute" stroke-width="1.6" marker-end="url(#ah-ic)"/><text x="370" y="116" text-anchor="middle" class="t-ink" style="font:400 12px ui-monospace,monospace">2nd Map</text><path d="M540,128 L620,128" fill="none" class="s-mute" stroke-width="1.6" marker-end="url(#ah-ic)"/><text x="580" y="116" text-anchor="middle" class="t-ink" style="font:400 12px ui-monospace,monospace">5th Map</text><text x="85" y="190" text-anchor="middle" class="t-mute" style="font:400 12px system-ui,sans-serif">runtime LoadIC::Load</text><text x="275" y="190" text-anchor="middle" class="t-mute" style="font:400 12px system-ui,sans-serif">one compare, one load</text><text x="475" y="190" text-anchor="middle" class="t-mute" style="font:400 12px system-ui,sans-serif">k compares, k at most 4</text><text x="675" y="190" text-anchor="middle" class="t-mute" style="font:400 12px system-ui,sans-serif">hash probe, no more growth</text><text x="380" y="250" text-anchor="middle" class="t-mute" style="font:400 13px system-ui,sans-serif">State only moves rightward. An IC never returns to an earlier state.</text></svg>
