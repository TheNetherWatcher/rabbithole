e" style="font:12px var(--mono)">A, 3rd</text><line x1="464" y1="144" x2="570" y2="198" class="s-mute" stroke-width="2"/><text x="509.0" y="171.0" text-anchor="end" class="t-mute" style="font:700 13px var(--mono)">L</text><circle cx="580" cy="210" r="18" class="f-acc2 s-ink" stroke-width="2"/><text x="580" y="215" text-anchor="middle" class="t-ink" style="font:700 16px var(--mono)">z</text><text x="580" y="243" text-anchor="middle" class="t-mute" style="font:12px var(--mono)">B, 1st</text><line x1="594" y1="224" x2="650" y2="268" class="s-mute" stroke-width="2"/><text x="614.0" y="246.0" text-anchor="end" class="t-mute" style="font:700 13px var(--mono)">L</text><circle cx="660" cy="280" r="18" class="f-acc2 s-ink" stroke-width="2"/><text x="660" y="285" text-anchor="middle" class="t-ink" style="font:700 16px var(--mono)">y</text><text x="660" y="313" text-anchor="middle" class="t-mute" style="font:12px var(--mono)">B, 2nd</text><line x1="674" y1="294" x2="730" y2="338" class="s-mute" stroke-width="2"/><text x="694.0" y="316.0" text-anchor="end" class="t-mute" style="font:700 13px var(--mono)">L</text><circle cx="740" cy="350" r="18" class="f-acc2 s-ink" stroke-width="2"/><text x="740" y="355" text-anchor="middle" class="t-ink" style="font:700 16px var(--mono)">x</text><text x="740" y="383" text-anchor="middle" class="t-mute" style="font:12px var(--mono)">B, 3rd</text><text x="40" y="40" class="t-mute" style="font:600 14px system-ui">Fugue tree (L = left child, R = right child)</text><text x="40" y="76" class="t-mute" style="font:13px system-ui">Siblings c and z share a parent and side,</text><text x="40" y="94" class="t-mute" style="font:13px system-ui">so they sort by ID: A’s subtree first.</text><text x="450" y="410" text-anchor="middle" class="t-ink" style="font:700 15px system-ui">in-order walk: a b c x y z (left kids, node, right kids) ... X a b c x y z Z</text></svg>