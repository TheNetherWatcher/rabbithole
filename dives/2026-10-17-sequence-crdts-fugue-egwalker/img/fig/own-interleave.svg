<svg viewBox="0 0 640 268" xmlns="http://www.w3.org/2000/svg" role="img"><text x="20" y="36" class="t-ink" style="font:700 15px system-ui">RGA, backward typing (sim output XxaybzcZ)</text><rect x="20" y="50" width="40" height="44" rx="6" class="f-line"/><text x="40" y="79" text-anchor="middle" class="t-ink" style="font:700 20px var(--mono);fill:var(--ink)">X</text><rect x="66" y="50" width="40" height="44" rx="6" class="f-acc2"/><text x="86" y="79" text-anchor="middle" class="" style="font:700 20px var(--mono);fill:var(--bg)">x</text><rect x="112" y="50" width="40" height="44" rx="6" class="f-acc"/><text x="132" y="79" text-anchor="middle" class="" style="font:700 20px var(--mono);fill:var(--bg)">a</text><rect x="158" y="50" width="40" height="44" rx="6" class="f-acc2"/><text x="178" y="79" text-anchor="middle" class="" style="font:700 20px var(--mono);fill:var(--bg)">y</text><rect x="204" y="50" width="40" height="44" rx="6" class="f-acc"/><text x="224" y="79" text-anchor="middle" class="" style="font:700 20px var(--mono);fill:var(--bg)">b</text><rect x="250" y="50" width="40" height="44" rx="6" class="f-acc2"/><text x="270" y="79" text-anchor="middle" class="" style="font:700 20px var(--mono);fill:var(--bg)">z</text><rect x="296" y="50" width="40" height="44" rx="6" class="f-acc"/><text x="316" y="79" text-anchor="middle" class="" style="font:700 20px var(--mono);fill:var(--bg)">c</text><rect x="342" y="50" width="40" height="44" rx="6" class="f-line"/><text x="362" y="79" text-anchor="middle" class="t-ink" style="font:700 20px var(--mono);fill:var(--ink)">Z</text><text x="400" y="79" style="font:700 15px system-ui;fill:var(--bad)">interleaved</text><text x="20" y="136" class="t-ink" style="font:700 15px system-ui">Fugue, same operations (sim output XabcxyzZ)</text><rect x="20" y="150" width="40" height="44" rx="6" class="f-line"/><text x="40" y="179" text-anchor="middle" class="t-ink" style="font:700 20px var(--mono);fill:var(--ink)">X</text><rect x="66" y="150" width="40" height="44" rx="6" class="f-acc"/><text x="86" y="179" text-anchor="middle" class="" style="font:700 20px var(--mono);fill:var(--bg)">a</text><rect x="112" y="150" width="40" height="44" rx="6" class="f-acc"/><text x="132" y="179" text-anchor="middle" class="" style="font:700 20px var(--mono);fill:var(--bg)">b</text><rect x="158" y="150" width="40" height="44" rx="6" class="f-acc"/><text x="178" y="179" text-anchor="middle" class="" style="font:700 20px var(--mono);fill:var(--bg)">c</text><rect x="204" y="150" width="40" height="44" rx="6" class="f-acc2"/><text x="224" y="179" text-anchor="middle" class="" style="font:700 20px var(--mono);fill:var(--bg)">x</text><rect x="250" y="150" width="40" height="44" rx="6" class="f-acc2"/><text x="270" y="179" text-anchor="middle" class="" style="font:700 20px var(--mono);fill:var(--bg)">y</text><rect x="296" y="150" width="40" height="44" rx="6" class="f-acc2"/><text x="316" y="179" text-anchor="middle" class="" style="font:700 20px var(--mono);fill:var(--bg)">z</text><rect x="342" y="150" width="40" height="44" rx="6" class="f-line"/><text x="362" y="179" text-anchor="middle" class="t-ink" style="font:700 20px var(--mono);fill:var(--ink)">Z</text><text x="400" y="179" style="font:700 15px system-ui;fill:var(--ok)">runs stay whole</text><text x="20" y="232" class="t-mute" style="font:13px system-ui">A typed c, b, a at index 1; B typed z, y, x at index 1; both started from "XZ".</text><text x="20" y="252" class="t-mute" style="font:13px system-ui">Both replicas print the same text, so the difference is the tie-break rule.</text></svg>