<svg viewBox="0 0 880 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three message ladders: full handshake, resumption and 0-RTT resumption"><style>.fl{font:13px system-ui,sans-serif;fill:var(--ink)}.fm{font:12px system-ui,sans-serif;fill:var(--mute)}.fb{font:700 13px system-ui,sans-serif;fill:var(--ink)}.fx{font:12px var(--mono);fill:var(--ink)}</style><text x="170.0" y="22" class="fb" text-anchor="middle">full handshake</text><text x="60" y="44" class="fm" text-anchor="middle">client</text><text x="280" y="44" class="fm" text-anchor="middle">server</text><line x1="60" y1="50" x2="60" y2="250" class="s-line" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="280" y1="50" x2="280" y2="250" class="s-line" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="60" y1="74" x2="280" y2="74" class="s-ink" stroke-width="2" /><polygon points="280,74 271,69 271,79" class="f-ink"/><text x="170.0" y="68" class="fm" text-anchor="middle">ClientHello</text><line x1="280" y1="104" x2="60" y2="104" class="s-ink" stroke-width="2" /><polygon points="60,104 69,99 69,109" class="f-ink"/><text x="170.0" y="98" class="fm" text-anchor="middle">ServerHello … Finished</text><line x1="60" y1="134" x2="280" y2="134" class="s-warn" stroke-width="2" /><polygon points="280,134 271,129 271,139" class="f-warn"/><text x="170.0" y="128" class="fm" text-anchor="middle">Finished + request</text><line x1="280" y1="164" x2="60" y2="164" class="s-ink" stroke-width="2" /><polygon points="60,164 69,159 69,169" class="f-ink"/><text x="170.0" y="158" class="fm" text-anchor="middle">response</text><text x="450.0" y="22" class="fb" text-anchor="middle">1-RTT resumption</text><text x="340" y="44" class="fm" text-anchor="middle">client</text><text x="560" y="44" class="fm" text-anchor="middle">server</text><line x1="340" y1="50" x2="340" y2="250" class="s-line" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="560" y1="50" x2="560" y2="250" class="s-line" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="340" y1="74" x2="560" y2="74" class="s-ink" stroke-width="2" /><polygon points="560,74 551,69 551,79" class="f-ink"/><text x="450.0" y="68" class="fm" text-anchor="middle">ClientHello + PSK</text><line x1="560" y1="104" x2="340" y2="104" class="s-ink" stroke-width="2" /><polygon points="340,104 349,99 349,109" class="f-ink"/><text x="450.0" y="98" class="fm" text-anchor="middle">ServerHello … Finished</text><line x1="340" y1="134" x2="560" y2="134" class="s-warn" stroke-width="2" /><polygon points="560,134 551,129 551,139" class="f-warn"/><text x="450.0" y="128" class="fm" text-anchor="middle">Finished + request</text><line x1="560" y1="164" x2="340" y2="164" class="s-ink" stroke-width="2" /><polygon points="340,164 349,159 349,169" class="f-ink"/><text x="450.0" y="158" class="fm" text-anchor="middle">response</text><text x="730.0" y="22" class="fb" text-anchor="middle">0-RTT resumption</text><text x="620" y="44" class="fm" text-anchor="middle">client</text><text x="840" y="44" class="fm" text-anchor="middle">server</text><line x1="620" y1="50" x2="620" y2="250" class="s-line" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="840" y1="50" x2="840" y2="250" class="s-line" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="620" y1="74" x2="840" y2="74" class="s-acc" stroke-width="2" /><polygon points="840,74 831,69 831,79" class="f-acc"/><text x="730.0" y="68" class="fm" text-anchor="middle">ClientHello + PSK + request</text><line x1="840" y1="104" x2="620" y2="104" class="s-ink" stroke-width="2" /><polygon points="620,104 629,99 629,109" class="f-ink"/><text x="730.0" y="98" class="fm" text-anchor="middle">ServerHello … response</text><line x1="620" y1="134" x2="840" y2="134" class="s-ink" stroke-width="2" /><polygon points="840,134 831,129 831,139" class="f-ink"/><text x="730.0" y="128" class="fm" text-anchor="middle">EndOfEarlyData, Finished</text><text x="60" y="290" class="fm" >Request leaves after 1 RTT</text><text x="340" y="290" class="fm" >Request leaves after 1 RTT</text><text x="620" y="290" class="fm" >Request leaves in flight 1</text><text x="60" y="310" class="fm" >Times are for TLS over TCP; the TCP handshake is not drawn. With QUIC, 0-RTT shortens 2 round trips to 1.</text></svg>