<svg viewBox="0 0 780 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Server decision flow for accepting or rejecting early data"><style>.fl{font:13px system-ui,sans-serif;fill:var(--ink)}.fm{font:12px system-ui,sans-serif;fill:var(--mute)}.fb{font:700 13px system-ui,sans-serif;fill:var(--ink)}.fx{font:12px var(--mono);fill:var(--ink)}</style><rect x="60" y="20" width="260" height="40" rx="6" class="f-panel s-line" stroke-width="1.5"/><text x="190.0" y="45.0" class="fl" text-anchor="middle">Ticket decrypts, still valid?</text><rect x="60" y="90" width="260" height="40" rx="6" class="f-panel s-line" stroke-width="1.5"/><text x="190.0" y="115.0" class="fl" text-anchor="middle">PSK binder verifies?</text><rect x="60" y="160" width="260" height="40" rx="6" class="f-panel s-line" stroke-width="1.5"/><text x="190.0" y="185.0" class="fl" text-anchor="middle">Ticket age within window?</text><rect x="60" y="230" width="260" height="40" rx="6" class="f-panel s-line" stroke-width="1.5"/><text x="190.0" y="255.0" class="fl" text-anchor="middle">ClientHello not in replay cache?</text><line x1="190" y1="60" x2="190" y2="90" class="s-ink" stroke-width="2" /><polygon points="190,90 181,85 181,95" class="f-ink"/><line x1="190" y1="130" x2="190" y2="160" class="s-ink" stroke-width="2" /><polygon points="190,160 181,155 181,165" class="f-ink"/><line x1="190" y1="200" x2="190" y2="230" class="s-ink" stroke-width="2" /><polygon points="190,230 181,225 181,235" class="f-ink"/><rect x="60" y="300" width="260" height="40" rx="6" class="f-panel s-ok" stroke-width="1.5"/><text x="190.0" y="325.0" class="fl" text-anchor="middle">Accept early data, record the ClientHello</text><line x1="190" y1="270" x2="190" y2="300" class="s-ok" stroke-width="2" /><rect x="430" y="90" width="300" height="70" rx="6" class="f-panel s-warn" stroke-width="1.5"/><text x="580" y="119" class="fb" text-anchor="middle">Reject 0-RTT</text><text x="580" y="139" class="fl" text-anchor="middle">ignore early records, finish a normal handshake</text><line x1="320" y1="40" x2="430" y2="105" class="s-warn" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="320" y1="110" x2="430" y2="125" class="s-warn" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="320" y1="180" x2="430" y2="125" class="s-warn" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="320" y1="250" x2="430" y2="125" class="s-warn" stroke-width="1.5" stroke-dasharray="4 3"/><text x="430" y="190" class="fm" >Client then resends the request after the handshake.</text><text x="430" y="208" class="fm" >Bloom-style caches with false positives must reject,</text><text x="430" y="226" class="fm" >never abort the connection (RFC 8446 §8.2).</text><text x="330" y="12" class="fm" >any "no"</text></svg>