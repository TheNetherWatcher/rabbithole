<svg viewBox="0 0 780 312" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Key schedule from the resumption secret to the early traffic secret"><style>.fl{font:13px system-ui,sans-serif;fill:var(--ink)}.fm{font:12px system-ui,sans-serif;fill:var(--mute)}.fb{font:700 13px system-ui,sans-serif;fill:var(--ink)}.fx{font:12px var(--mono);fill:var(--ink)}</style><rect x="20" y="20" width="250" height="44" rx="6" class="f-panel s-line" stroke-width="1.5"/><text x="30" y="40" class="fx" >resumption_master_secret</text><text x="30" y="56" class="fm" >(from the previous connection)</text><line x1="145" y1="64" x2="145" y2="96" class="s-ink" stroke-width="2" /><polygon points="145,100 140,91 150,91" class="f-ink"/><rect x="20" y="100" width="250" height="44" rx="6" class="f-panel s-acc" stroke-width="1.5"/><text x="30" y="120" class="fx" >PSK = HKDF-Expand-Label(</text><text x="30" y="136" class="fx" >  rms, "resumption", ticket_nonce)</text><line x1="145" y1="144" x2="145" y2="176" class="s-ink" stroke-width="2" /><polygon points="145,180 140,171 150,171" class="f-ink"/><rect x="20" y="180" width="250" height="44" rx="6" class="f-panel s-ink" stroke-width="2"/><text x="30" y="200" class="fb" >Early Secret</text><text x="30" y="216" class="fx" >= HKDF-Extract(salt 0, IKM = PSK)</text><line x1="270" y1="202" x2="330" y2="54" class="s-ink" stroke-width="1.5" /><rect x="330" y="30" width="400" height="52" rx="6" class="f-panel s-line" stroke-width="1.5"/><text x="340" y="50" class="fb" >binder_key</text><text x="340" y="68" class="fx" >Derive-Secret(ES, "res binder", "")</text><text x="340" y="81" class="fm" ></text><text x="740" y="58" class="fm" ></text><line x1="270" y1="202" x2="330" y2="134" class="s-ink" stroke-width="1.5" /><rect x="330" y="110" width="400" height="52" rx="6" class="f-panel s-acc" stroke-width="1.5"/><text x="340" y="130" class="fb" >client_early_traffic_secret</text><text x="340" y="148" class="fx" >Derive-Secret(ES, "c e traffic", ClientHello)</text><text x="340" y="161" class="fm" ></text><text x="740" y="138" class="fm" ></text><line x1="270" y1="202" x2="330" y2="214" class="s-ink" stroke-width="1.5" /><rect x="330" y="190" width="400" height="52" rx="6" class="f-panel s-line" stroke-width="1.5"/><text x="340" y="210" class="fb" >early_exporter_master_secret</text><text x="340" y="228" class="fx" >Derive-Secret(ES, "e exp master", ClientHello)</text><text x="340" y="241" class="fm" ></text><text x="740" y="218" class="fm" ></text><text x="20" y="262" class="fm" >No server input appears anywhere above: the early key needs only the PSK and the ClientHello.</text><text x="20" y="282" class="fm" >The ServerHello (and a fresh ECDHE secret) only join in later, for the handshake secret.</text></svg>