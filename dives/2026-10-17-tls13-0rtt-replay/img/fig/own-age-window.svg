<svg viewBox="0 0 780 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline of the ticket age check"><style>.fl{font:13px system-ui,sans-serif;fill:var(--ink)}.fm{font:12px system-ui,sans-serif;fill:var(--mute)}.fb{font:700 13px system-ui,sans-serif;fill:var(--ink)}.fx{font:12px var(--mono);fill:var(--ink)}</style><line x1="40" y1="130" x2="740" y2="130" class="s-mute" stroke-width="2" /><line x1="100" y1="110" x2="100" y2="150" class="s-ink" stroke-width="2" /><text x="100" y="100" class="fb" text-anchor="middle">ticket issued</text><text x="100" y="170" class="fm" text-anchor="middle">creation_time</text><line x1="260" y1="110" x2="260" y2="150" class="s-ink" stroke-width="2" /><text x="260" y="100" class="fb" text-anchor="middle">+ RTT estimate</text><text x="260" y="170" class="fm" text-anchor="middle">adjusted_creation_time</text><line x1="580" y1="110" x2="580" y2="150" class="s-ink" stroke-width="2" /><text x="580" y="100" class="fb" text-anchor="middle">ClientHello arrives</text><text x="580" y="170" class="fm" text-anchor="middle">expected vs now</text><rect x="530" y="112" width="100" height="36" rx="4" class="f-ok" opacity=".3"/><text x="580" y="196" class="fm" text-anchor="middle">acceptance window, about ±10 s</text><path d="M260 70 H 580" class="f-none s-acc" stroke-width="2"/><polygon points="580,70 571,65 571,75" class="f-acc"/><text x="395" y="62" class="fl" text-anchor="middle">client's ticket age = obfuscated_ticket_age − ticket_age_add</text><text x="40" y="240" class="fx" >expected_arrival_time = adjusted_creation_time + clients_ticket_age</text><text x="40" y="262" class="fx" >accept 0-RTT only if |expected_arrival_time − server_now| &lt; window; otherwise fall back to 1-RTT</text></svg>