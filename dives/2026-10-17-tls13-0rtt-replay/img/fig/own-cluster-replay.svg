<svg viewBox="0 0 900 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three cluster designs and how many times a replay runs"><style>.fl{font:13px system-ui,sans-serif;fill:var(--ink)}.fm{font:12px system-ui,sans-serif;fill:var(--mute)}.fb{font:700 13px system-ui,sans-serif;fill:var(--ink)}.fx{font:12px var(--mono);fill:var(--ink)}</style><text x="150" y="24" class="fb" text-anchor="middle">No shared state</text><rect x="90" y="40" width="120" height="30" rx="5" class="f-code s-line" stroke-width="1.5"/><text x="150" y="60" class="fm" text-anchor="middle">replayed flight</text><line x1="150" y1="70" x2="60" y2="112" class="s-bad" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="20" y="112" width="80" height="40" rx="6" class="f-panel s-bad" stroke-width="1.5"/><text x="60" y="130" class="fb" text-anchor="middle">node A</text><text x="60" y="146" class="fm" text-anchor="middle">accepted</text><line x1="150" y1="70" x2="152" y2="112" class="s-bad" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="112" y="112" width="80" height="40" rx="6" class="f-panel s-bad" stroke-width="1.5"/><text x="152" y="130" class="fb" text-anchor="middle">node B</text><text x="152" y="146" class="fm" text-anchor="middle">accepted</text><line x1="150" y1="70" x2="244" y2="112" class="s-bad" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="204" y="112" width="80" height="40" rx="6" class="f-panel s-bad" stroke-width="1.5"/><text x="244" y="130" class="fb" text-anchor="middle">node C</text><text x="244" y="146" class="fm" text-anchor="middle">accepted</text><text x="150" y="190" class="fl" text-anchor="middle">3 runs from one captured flight</text><text x="450" y="24" class="fb" text-anchor="middle">State per zone</text><rect x="390" y="40" width="120" height="30" rx="5" class="f-code s-line" stroke-width="1.5"/><text x="450" y="60" class="fm" text-anchor="middle">replayed flight</text><line x1="450" y1="70" x2="360" y2="112" class="s-bad" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="320" y="112" width="80" height="40" rx="6" class="f-panel s-bad" stroke-width="1.5"/><text x="360" y="130" class="fb" text-anchor="middle">node A</text><text x="360" y="146" class="fm" text-anchor="middle">accepted</text><line x1="450" y1="70" x2="452" y2="112" class="s-bad" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="412" y="112" width="80" height="40" rx="6" class="f-panel s-ok" stroke-width="1.5"/><text x="452" y="130" class="fb" text-anchor="middle">node B</text><text x="452" y="146" class="fm" text-anchor="middle">rejected</text><line x1="450" y1="70" x2="544" y2="112" class="s-bad" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="504" y="112" width="80" height="40" rx="6" class="f-panel s-bad" stroke-width="1.5"/><text x="544" y="130" class="fb" text-anchor="middle">node C</text><text x="544" y="146" class="fm" text-anchor="middle">accepted</text><text x="450" y="190" class="fl" text-anchor="middle">2 runs from one captured flight</text><text x="750" y="24" class="fb" text-anchor="middle">One owner per ticket</text><rect x="690" y="40" width="120" height="30" rx="5" class="f-code s-line" stroke-width="1.5"/><text x="750" y="60" class="fm" text-anchor="middle">replayed flight</text><line x1="750" y1="70" x2="660" y2="112" class="s-bad" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="620" y="112" width="80" height="40" rx="6" class="f-panel s-bad" stroke-width="1.5"/><text x="660" y="130" class="fb" text-anchor="middle">node A</text><text x="660" y="146" class="fm" text-anchor="middle">accepted</text><line x1="750" y1="70" x2="752" y2="112" class="s-bad" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="712" y="112" width="80" height="40" rx="6" class="f-panel s-ok" stroke-width="1.5"/><text x="752" y="130" class="fb" text-anchor="middle">node B</text><text x="752" y="146" class="fm" text-anchor="middle">rejected</text><line x1="750" y1="70" x2="844" y2="112" class="s-bad" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="804" y="112" width="80" height="40" rx="6" class="f-panel s-ok" stroke-width="1.5"/><text x="844" y="130" class="fb" text-anchor="middle">node C</text><text x="844" y="146" class="fm" text-anchor="middle">rejected</text><text x="750" y="190" class="fl" text-anchor="middle">1 run from one captured flight</text><text x="20" y="226" class="fm" >RFC 8446 §8 minimum: any one instance accepts a given 0-RTT handshake at most once.</text><text x="20" y="246" class="fm" >The tightest design lets a single zone own each ticket and refuse 0-RTT elsewhere.</text></svg>